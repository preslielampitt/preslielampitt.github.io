<!DOCTYPE html>
<html>
    <head>
        <!-- the head tag is for non-visible information -->
        <title>Preslie's Website!</title>
        <meta property="og:url"           content="https://preslielampitt.github.io/" />
        <meta property="og:type"          content="website" />
        <meta property="og:title"         content="Preslie's Website!" />
        <meta property="og:description"   content="This is an example from class in CS040." />
        <meta property="og:image"         content="https://www.your-domain.com/path/image.jpg" />
        <!-- style tag always inside the head tag -->
        <!-- adding the #selected will select the tags with id="selected" -->
        <!-- adding the .menu selects the tags with class="menu" -->
        
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-183G4PGW3V"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-183G4PGW3V');
        </script> 
        
        <style>
            ul.menu {
                list-style-type: none;
                overflow: hidden;
            }
            li.menu {
                background-color: lightblue;
                float: left;
                margin: 0;
                padding: 10px;
            }
            li#selected {
                background-color: blue;
            }
        </style>
    </head>

    <body>
        <!-- all visible "stuff" on the page inside the body tag -->

        <!-- Load Facebook SDK for JavaScript -->
        <div id="fb-root"></div>
        <script async defer crossorigin="anonymous" 
            src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v24.0&appId=APP_ID">
        </script>

        <!-- Like Button -->
        <div class="fb-like" 
            data-href="https://preslielampitt.github.io/" 
            data-width="100"
            data-layout="button_count" 
            data-action="like" 
            data-size="large" 
            data-share="true">
        </div>

        <!-- Goal: Create a navigation menu bar -->
        <h1 style="color: red;">My Zoo Webpage</h1>
        <!-- div = divider; divide the webage into "chunks" -->
        <div>
        <ul class="menu">
            <!-- whenever you refer to your own webpage, 
            or an HTML files that's "inside your webpage", 
            do not include https:// -->
            <li class="menu"><a href="elephant.html">Elephant</a></li>
            <li class="menu">Giraffe</li>
            <li class="menu" id="selected">Tiger</li>
            <li class="menu">Lion</li>
        </ul>
        </div>

        <div>
        <h2>Names of Giraffes</h2>
        <ul>
            <li><a href="https://doesnotexist">Marty</a></li>
            <li>Steve</li>
            <li>George</li>
        </ul>
        </div>

    </body>

    <footer>
        <a href="https://example.com">CS040</a> by <a href="https://example.com">Preslie Lampitt</a> is marked <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/zero.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
    </footer>
</html>
